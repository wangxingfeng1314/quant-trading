name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查（py_compile）
        run: |
          python -c "
          import py_compile, glob, os
          files = glob.glob('**/*.py', recursive=True)
          files = [f for f in files if 'venv' not in f and '__pycache__' not in f]
          errors = 0
          for f in files:
            try:
              py_compile.compile(f, doraise=True)
            except py_compile.PyCompileError as e:
              print(f'❌ {f}: {e}')
              errors += 1
          print(f'✓ 检查 {len(files)} 个文件, {errors} 个错误')
          assert errors == 0
          "

      - name: 安装静态检查工具
        run: python -m pip install ruff

      - name: 静态检查（ruff：未定义名零容忍，阻断）
        run: ruff check . --select F821 --output-format=concise

      - name: 静态检查（ruff：全量报告，暂不阻断）
        continue-on-error: true
        run: ruff check . --output-format=concise

      - name: 运行单元测试
        run: |
          python -m pytest tests/ -v --tb=short

      - name: 检查 import 一致性
        run: |
          python -c "
          # 验证关键模块能正常导入
          modules = [
            'core.config', 'core.models',
            'engine.backtester', 'engine.portfolio',
            'engine.position', 'engine.commission', 'engine.scanner',
            'data.storage', 'data.fetcher', 'data.cleaner',
            'data.indicators',
            'strategies',
          ]
          failed = []
          for m in modules:
            try:
              __import__(m)
              print(f'✓ {m}')
            except Exception as e:
              failed.append((m, str(e)))
              print(f'✗ {m}: {e}')
          # 导入失败必须让 CI 失败，不能只打一个 ⚠ 就放过
          assert not failed, f'关键模块导入失败: {failed}'
          "
